plugins {
    id 'com.android.application'
}

android {
    namespace 'com.redutor.video'
    compileSdk 35

    defaultConfig {
        applicationId 'com.redutor.video'
        minSdk 29
        targetSdk 35
        versionCode 8
        versionName '3.3'
    }

    // Assinatura fixa: a mesma chave em todo build, para instalar atualizações por cima.
    def keystore = System.getenv('KEYSTORE_FILE')
    signingConfigs {
        fixa {
            if (keystore) {
                storeFile file(keystore)
                storeType 'pkcs12'
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'redutor'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        // Versão final: R8 remove código e recursos não usados (APK bem menor).
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystore) signingConfig signingConfigs.fixa
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-transformer:1.5.1'
    implementation 'androidx.media3:media3-common:1.5.1'
    implementation 'androidx.media3:media3-effect:1.5.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.9.3'
    testImplementation 'junit:junit:4.13.2'
}
