name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # para publicar o APK em Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # o token de escrita não fica em .git/config durante o build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta o segredo KEYSTORE_BASE64 (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/redutor.p12"
      - run: gradle testDebugUnitTest assembleDebug
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/redutor.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - run: mv app/build/outputs/apk/debug/app-debug.apk RedutorDeVideo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RedutorDeVideo-apk
          path: RedutorDeVideo.apk
      # Cada versionName vira uma Release; o link .../releases/latest/download/RedutorDeVideo.apk sempre baixa a última.
      - name: Publicar em Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          if gh release view "v$V" > /dev/null 2>&1; then
            gh release upload "v$V" RedutorDeVideo.apk --clobber
          else
            gh release create "v$V" RedutorDeVideo.apk --title "Redutor de Vídeo $V" \
              --notes "Baixe o **RedutorDeVideo.apk** abaixo pelo celular e abra para instalar. Atualiza por cima da versão anterior."
          fi
